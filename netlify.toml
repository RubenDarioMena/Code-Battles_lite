[build]
  command = "node scripts/preparar-netlify.mjs"
  publish = "dist"

# Telemetría mínima de la prueba con compañeros: POST/GET /api/t (ver docs/TELEMETRIA.md).
[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
