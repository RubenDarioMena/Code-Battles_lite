<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laboratorio VFX · Code Battle Lite</title>
  <link rel="stylesheet" href="../../paquetes/editor/estilos/tema.css">
  <link rel="stylesheet" href="../../Prototypes/Rocket%20Launcher/css/base.css">
  <link rel="stylesheet" href="laboratorio.css">
</head>
<body>
  <header>
    <h1 data-texto="titulo"></h1>
    <p data-texto="descripcion"></p>
    <div class="controles">
      <label><span data-texto="receta"></span> <select id="receta"></select></label>
      <button id="reproducir" data-texto="repetir"></button><button id="pausa" data-texto="pausa"></button>
      <label><span data-texto="velocidad"></span> <select id="velocidad"><option value="1">1×</option><option value="0.25">0,25×</option></select></label>
      <label><span data-texto="calidad"></span> <select id="calidad"><option value="alto" data-texto="alto"></option><option value="medio" data-texto="medio"></option><option value="bajo" data-texto="bajo"></option><option value="no" data-texto="no"></option></select></label>
      <label><span data-texto="tiempo"></span> <input id="tiempo" type="range" min="0" max="1.6" step="0.001" value="0"></label>
      <output id="contador"></output>
    </div>
    <p id="estado" role="status" data-texto="preparando"></p>
  </header>
  <main>
    <div class="visores"><section><h2>3D</h2><canvas id="tres" width="640" height="400"></canvas></section>
      <section><h2 data-texto="plano"></h2><canvas id="plano" width="640" height="400"></canvas></section></div>
    <section id="hoja"><h2 id="titulo-hoja" data-texto="hoja"></h2><canvas id="contactos" width="1540" height="440"></canvas></section>
    <p data-texto="nota"></p>
  </main>
  <script type="module" src="entrada.js"></script>
</body>
</html>
