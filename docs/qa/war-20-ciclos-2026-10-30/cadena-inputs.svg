<g fill="#f1f5f9" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="590" y="28" font-size="19">20 ciclos · cadena de inputs y recuperación</text><text x="118" y="84">1. Preparar referencia</text><text x="118" y="111">Build + viewport + nivel</text><text x="118" y="135">Captura antes</text><text x="354" y="84">2. Umbral 1–4 clics</text><text x="354" y="111">Selección por UI</text><text x="354" y="135">Sin teclado</text><text x="592" y="84">3. Perturbación aleatoria</text><text x="592" y="111">Carácter → botón</text><text x="592" y="135">Semilla + captura + traza</text><text x="829" y="84">4. Recuperación UI</text><text x="829" y="111">Borrar → observar</text><text x="829" y="135">Ampliar / línea / Deshacer</text><text x="1064" y="84">5. Verificar y cerrar</text><text x="1064" y="111">Texto exacto + captura</text><text x="1064" y="135">JSON + log de inputs</text><text x="590" y="185" fill="#cbd5e1">Preparación fuera del intento · pausas y coordenadas reales en LOG-INPUTS.md</text></g></svg>
