<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f13">
  <title>Laboratorio de batalla · Code Battle Lite</title>
  <link rel="stylesheet" href="../../shared/editor/tema.css?v=1"><link rel="stylesheet" href="../../shared/editor/editor.css?v=1">
  <link rel="stylesheet" href="../../shared/css/edicion.css?v=7"><link rel="stylesheet" href="../../shared/editor/autonomo.css?v=3">
  <link rel="stylesheet" href="../../Prototypes/Rocket%20Launcher/css/base.css?v=4">
  <link rel="stylesheet" href="css/batalla.css?v=1">
</head>
<body>
  <div id="lab" data-panel="batalla" data-estado="listo">
    <header class="barra">
      <a class="volver" href="../../index.html" aria-label="Volver al inicio">←</a>
      <span class="placa titulo">Laboratorio · Batalla</span>
      <select id="escenario" class="mini" aria-label="Prueba"></select>
      <button id="b-ejecutar" class="principal" type="button">▶ Ejecutar</button>
      <button id="b-pausa" class="mini" type="button" aria-pressed="false" aria-label="Pausa" title="Pausa (los clics se guardan y llegan al reanudar)">⏸</button>
      <span class="velocidades" role="group" aria-label="Velocidad">
        <button class="mini" type="button" data-vel="1" aria-pressed="true">1×</button><button class="mini" type="button" data-vel="2" aria-pressed="false">2×</button><button class="mini" type="button" data-vel="4" aria-pressed="false">4×</button>
      </span>
      <button id="b-repetir" class="mini" type="button" hidden title="Repite la batalla con los mismos clics y reprogramaciones, con el código actual">↻ Repetir mis clics</button>
      <span class="hueco"></span>
      <button id="b-guia" class="mini" type="button" aria-haspopup="dialog">Órdenes</button>
      <span class="paneles" role="group" aria-label="Panel">
        <button class="mini" type="button" data-panel="batalla" aria-pressed="true">Batalla</button><button class="mini" type="button" data-panel="codigo" aria-pressed="false">Código</button>
      </span>
    </header>

    <main>
      <section class="panel-batalla marco" aria-label="Batalla">
        <div class="hud" id="hud">
          <span class="dato" data-corto="t"><i>Tiempo</i><b id="h-tiempo">0:00</b></span>
          <span class="dato muro" data-corto="Muro"><i>Muro</i><span class="barra-muro"><span id="h-muro-barra"></span></span><b id="h-muro">20</b></span>
          <span class="dato" data-corto="Enem."><i>Enemigos</i><b id="h-enemigos">0</b></span>
          <span class="dato" data-corto="Clics"><i>Clics</i><b id="h-clics">0</b></span>
        </div>
        <div class="destinatarios" id="destinatarios" role="group" aria-label="Unidades que reciben el clic"></div>
        <div class="campo" id="campo">
          <canvas id="lienzo" aria-label="Campo de batalla. Toca el terreno o un enemigo para mandar una orden; toca una unidad tuya para elegirla."></canvas>
          <div class="zoom"><button class="mini" id="b-zoom-mas" type="button" aria-label="Acercar">+</button><button class="mini" id="b-zoom-menos" type="button" aria-label="Alejar">−</button></div>
          <div class="aviso-campo" id="aviso-campo" role="status" hidden></div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <details class="prueba" id="prueba" open>
          <summary><span class="placa" id="p-etiqueta">Prueba</span><b id="p-titulo"></b></summary>
          <p id="p-objetivo"></p>
          <p class="pregunta"><i>Qué se quiere saber</i><span id="p-pregunta"></span></p>
          <p class="pista"><i>Pista</i><span id="p-pista"></span></p>
        </details>
      </section>

      <section class="panel-codigo marco" aria-label="Programas">
        <div class="pestanas" id="pestanas" role="tablist" aria-label="Programa de cada unidad"></div>
        <div class="acciones">
          <span class="de" id="prog-de"></span>
          <span class="hueco"></span>
          <button class="mini" id="b-aplicar" type="button" hidden title="Reinicia solo esta unidad con el código de ahora, sin parar la batalla">⚡ Aplicar ahora</button>
          <button class="mini" id="b-copiar" type="button">Copiar a las de su clase</button>
          <button class="mini" id="b-restaurar" type="button">Restaurar</button>
        </div>
        <div class="editor-raiz" id="editor-raiz"></div>
        <div class="consola-cab"><span class="placa">Consola</span><span class="hueco"></span><button class="mini" id="b-limpiar" type="button">Limpiar</button></div>
        <div class="consola" id="consola" role="log" aria-live="off"></div>
      </section>
    </main>

    <dialog id="guia" class="guia" aria-label="Órdenes del laboratorio">
      <header><h2>Órdenes del laboratorio</h2><button class="mini" id="guia-cerrar" type="button">Cerrar</button></header>
      <div class="guia-cuerpo" id="guia-cuerpo"></div>
    </dialog>
  </div>

  <script src="../../shared/vendor/acorn-8.11.3.js"></script><script src="../../shared/js/iconos.js?v=6"></script>
  <script src="../../shared/js/estructura.js?v=4"></script><script src="../../shared/editor/javascript.js?v=1"></script>
  <script src="../../shared/editor/lenguajes.js?v=2"></script><script src="../../shared/editor/plantillas.js?v=5"></script>
  <script src="../../shared/editor/adaptador-js.js?v=2"></script><script src="../../shared/editor/vida.js?v=1"></script>
  <script src="../../shared/editor/tips.js?v=1"></script><script src="../../shared/editor/edicion.js?v=6"></script>
  <script src="../../shared/editor/nucleo-ui.js?v=4"></script><script src="../../shared/editor/editor.js?v=4"></script>
  <script src="js/mundo.js?v=1"></script><script src="js/escenarios.js?v=1"></script><script src="js/runtime.js?v=1"></script>
  <script src="js/vista.js?v=1"></script><script src="js/app.js?v=1"></script>
</body>
</html>
