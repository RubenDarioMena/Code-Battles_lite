<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 128" width="384" height="256">
  <title>CNC</title>
  <desc>Mesa ranurada abierta con pórtico y cabezal móvil. Capas: mesa, pieza (sujeta con mordazas), portico (se mueve en Y) con cabezal (se mueve en X). La punta de la herramienta está en 50,52.</desc>
