<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio de murallas · Campaign</title>
<style>
*{box-sizing:border-box}
body{margin:0;display:grid;grid-template-columns:13rem 1fr;height:100dvh;color:#e9e4d5;background:#292f32;font:15px system-ui,sans-serif}
aside{display:flex;flex-direction:column;border-right:1px solid #626766;min-height:0}
h1{font:normal 30px Georgia,serif;margin:22px 16px 16px}
nav{overflow:auto;padding:0 8px 12px}
button{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:3px;background:none;color:inherit;text-align:left;font:inherit;padding:10px;cursor:pointer}
button span{font:12px monospace;color:#c3b994}
button[aria-pressed=true]{background:#e5dbc2;color:#302f2a}
button[aria-pressed=true] span{color:#5a584a}
button:focus-visible{outline:2px solid #d4af77;outline-offset:-2px}
main{position:relative;min-width:0;min-height:0;background:linear-gradient(#40566e,#817e91 58%,#b69c99)}
canvas{width:100%;height:100%;display:block;touch-action:none}
output{position:absolute;bottom:12px;left:12px;color:white;background:#292f32;padding:5px 9px;border-radius:3px}
output:empty{display:none}
@media(max-width:640px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}aside{border:0;min-width:0}h1{font-size:23px;margin:10px 14px 6px}nav{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto}button{width:auto;flex:none;min-height:44px;white-space:nowrap;gap:7px}}
</style>
